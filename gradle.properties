org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ── 库版本唯一真源 ────────────────────────────────────────────────
# 三个 library 模块与 sample 的 versionName 都从这里取，避免多模块版本漂移。
# 口径：新需求进 MINOR，缺陷与小调整按条数进 PATCH，文档与构建脚本不动版本位。
OM_VERSION=0.14.6

# 本模块的 groupId / artifactId 前缀，发布时使用
# 用 io.github.<用户名> 不需要域名验证，Maven Central 与 GitHub Packages 都接受。
# 如果你确实拥有 openmetro.io，可以改回 io.openmetro。
OM_GROUP=io.github.jeta1me1plus

# GitHub Packages 的仓库路径（OWNER/REPO）
OM_GITHUB_REPO=Jeta1me1PLUS/OpenMetroUI

# ── 发布元数据 ────────────────────────────────────────────────────
# Maven Central 要求 POM 里必须有 url / licenses / developers / scm，
# 缺任何一项都会被 Portal 拒收。这些值集中在这里，改一处即可。
#
# 公开前必须确认两件事：
# 1. groupId io.openmetro 要求你拥有 openmetro.io 域名；没有就改成 io.github.<用户名>
# 2. 许可证是否就是 Apache-2.0
OM_REPO_URL=https://github.com/Jeta1me1PLUS/OpenMetroUI
OM_LICENSE_NAME=Apache License 2.0
OM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0
OM_DEVELOPER_ID=Jeta1me1PLUS
OM_DEVELOPER_NAME=Jeta1me1PLUS
