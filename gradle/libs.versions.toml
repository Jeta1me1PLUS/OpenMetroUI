[versions]
# ── 工具链 ────────────────────────────────────────────────────────
# 与同机 OpenFile 工程保持一致（那套组合已在本机验证可构建）：
# AGP 9.1.0 要求 Gradle >= 9.1.0、JDK >= 17，最高支持 compileSdk 36；
# Gradle 9.3.1 与 JDK 21 均已在 ~/.gradle 缓存中，可离线构建。
agp = "9.1.0"
kotlin = "2.2.20"

# ── 依赖版本天花板 ────────────────────────────────────────────────
# AGP 9.1.0 最高只支持 compileSdk 36，而下列库的更新版本已要求 compileSdk 37，
# 因此停在这些版本上，等 AGP 支持 API 37 后再统一上调。数值来自逐个读取
# AAR 内 META-INF/com/android/build/gradle/aar-metadata.properties 的 minCompileSdk：
#   androidx.compose.ui:*   1.12.x -> 要求 37（1.11.x 要求 35）
#   androidx.activity:*     1.14.x -> 要求 37（1.13.0 要求 36）
composeBom = "2026.06.01"
# BOM 2026.06.01 对应的 Compose 版本。
# 发布出去的 POM / module metadata 里依赖必须带具体版本，否则宿主解析不到 ——
# 所以这里显式声明，而不是只靠 BOM 的约束。
compose = "1.11.4"
activityCompose = "1.13.0"

# 只测纯逻辑（对比度计算、栅格列宽），不引入 Robolectric
junit = "4.13.2"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
androidx-compose-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "compose" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
